name: qualify

# Reproducible qualification for the macOS-only Ralph helper. The deterministic
# unittest suite (CLI-boundary behavior plus the non-skippable packaging smokes)
# runs on Python 3.11 and a current newer version, using only the declared build
# tooling and the standard library. It never invokes a live Claude or OpenCode
# model or consumes any subscription allowance: the suite drives fake backends
# placed on PATH.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    # A static type-checker guards the declared interfaces mechanically (H11):
    # the Backend Protocol and the adapters that implement it, so a stale return
    # annotation is caught here rather than by reading. mypy is installed by CI
    # alone -- it is a developer tool, never a runtime dependency, so the project
    # keeps its zero-runtime-dependency property. Scope and target interpreter
    # are pinned in [tool.mypy] in pyproject.toml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the type-checker (CI only)
        run: python -m pip install --upgrade mypy
      - name: Type-check the source tree
        run: python -m mypy

  test:
    # macOS is the only supported platform (caffeinate, profiles, sys.platform).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the declared PEP 517 build tooling
        # setuptools is the declared build backend; the packaging smokes fail
        # closed (rather than skip) when it is absent, so install it explicitly.
        run: python -m pip install --upgrade "setuptools>=77" wheel
      - name: Run the deterministic no-model suite
        run: python -m unittest discover -s tests -v
