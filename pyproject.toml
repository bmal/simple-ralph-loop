[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-ralph-loop"
version = "0.1.0"
description = "A subscription-only loop for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ralph = "ralph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# The qualification workflow type-checks the source tree against the minimum
# supported interpreter (H11). mypy is a CI-installed developer tool, never a
# runtime dependency, so `[project].dependencies` stays empty and the zero-
# runtime-dependency property holds. Scope is `src`: the deterministic suite
# proves the tests, and the interface annotations live in the package.
python_version = "3.11"
files = ["src"]
